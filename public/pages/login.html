<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <main id="container_login">
        <div>
            <input id='username_input' class="login" type="text" placeholder="Username" autocomplete="off">
            <input id="password_input" class="login" type="password" placeholder="senha" autocomplete="off">
        </div>
        <div>
            <button type="submit">Logar</button>
        </div>
    </main>

    <main id="Container_signup">
        <div>
            <input id="username_input_signup" class="signup" type="text" placeholder="Username" autocomplete="off">
            <input id="password_input_signup" class="signup" type="text" placeholder="Senha" autocomplete="off">
        </div>
        <div>
            <button type="submit">Cadastrar</button>
        </div>
    </main>
</body>
</html>
